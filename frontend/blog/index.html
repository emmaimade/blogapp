<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Applied before first paint so there's no flash of the wrong theme:
         an explicit stored choice wins, otherwise follow the OS preference. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Everything between these markers is replaced per request by
         middleware.ts with the tenant's (and, on /post/:slug, the post's) real
         title/description/canonical/OG/JSON-LD, so link previews and crawlers
         that don't run JS still see correct tags. What's here is only the
         fallback when that lookup fails — keep it tenant-neutral. -->
    <!-- seo:start -->
    <title>Loading…</title>
    <meta name="description" content="" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Blank icon (not the platform's) until the tenant's favicon is known. -->
    <link rel="icon" href="data:," />
    <!-- seo:end -->

    <!-- Theme Color -->
    <meta name="theme-color" content="#9333EA" />
    <meta name="msapplication-TileColor" content="#9333EA" />

    <meta name="robots" content="index, follow" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, -apple-system, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to read this blog.</p>
      </div>
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
